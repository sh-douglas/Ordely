services:
  database:
    image: postgres:16-alpine
    container_name: ordely_databas
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ordely_postgres_data:/var/lib/postgresql/data
volumes:
  ordely_postgres_data:
